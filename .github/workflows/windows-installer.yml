name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, windows-installer]
    paths:
      - deploy/windows/**
      - .github/workflows/windows-installer.yml

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --global --force corepack
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build and verify standalone installer
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe', 'C:\Program Files\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'ISCC.exe missing' }
          uv run --no-project --python 3.13.14 python deploy/windows/build.py --output dist/windows --iscc $iscc
      - name: Upload installer and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArcReel-windows-x64
          path: |
            dist/windows/*-Setup.exe
            dist/windows/SHA256SUMS.txt
            dist/windows/ArcReel/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
